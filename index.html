<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PUC Centre</title>
    <meta
      name="description"
      content="Multi-tenant PUC Renewal Management SaaS for Indian PUC testing centres with automated voice reminder calling, customer & certificate lifecycle tracking, multilingual templates, and campaign analytics."
    />
    <meta property="og:title" content="PUC Centre" />
    <meta
      property="og:description"
      content="Multi-tenant PUC Renewal Management SaaS for Indian PUC testing centres with automated voice reminder calling, customer & certificate lifecycle tracking, multilingual templates, and campaign analytics."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('pucflow_theme') || 'dark';
          var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      .app-boot-loader {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .app-boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px 28px;
        border-radius: 16px;
        border: 1px solid #e4e4e7;
        background: #ffffff;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12);
      }
      html.dark .app-boot-card {
        border-color: #27272a;
        background: #0e0e11;
      }
      .app-boot-spinner {
        width: 44px;
        height: 44px;
        border-radius: 9999px;
        border: 3px solid #dbeafe;
        border-top-color: #2563eb;
        animation: appBootSpin 0.8s linear infinite;
      }
      html.dark .app-boot-spinner {
        border-color: #172554;
        border-top-color: #60a5fa;
      }
      .app-boot-text {
        font-family: 'DM Sans', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.025em;
        color: #3f3f46;
      }
      html.dark .app-boot-text {
        color: #e4e4e7;
      }
      @keyframes appBootSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="min-h-screen bg-zinc-50 text-zinc-950 dark:bg-black dark:text-zinc-50 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root">
      <div class="app-boot-loader" role="status" aria-live="polite">
        <div class="app-boot-card">
          <div class="app-boot-spinner"></div>
          <span class="app-boot-text">Loading...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
