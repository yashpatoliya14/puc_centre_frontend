<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PUC Centre</title>
    <meta
      name="description"
      content="Multi-tenant PUC Renewal Management SaaS for Indian PUC testing centres with automated voice reminder calling, customer & certificate lifecycle tracking, multilingual templates, and campaign analytics."
    />
    <meta property="og:title" content="PUC Centre" />
    <meta
      property="og:description"
      content="Multi-tenant PUC Renewal Management SaaS for Indian PUC testing centres with automated voice reminder calling, customer & certificate lifecycle tracking, multilingual templates, and campaign analytics."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('pucflow_theme') || 'dark';
          var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      .app-boot-loader {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-boot-spinner {
        width: 32px;
        height: 32px;
        animation: appBootSpin 0.75s linear infinite;
        color: #2563eb;
      }
      html.dark .app-boot-spinner {
        color: #3b82f6;
      }
      .app-boot-track {
        stroke: #e4e4e7;
      }
      html.dark .app-boot-track {
        stroke: #27272a;
      }
      @keyframes appBootSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="min-h-screen bg-zinc-50 text-zinc-950 dark:bg-black dark:text-zinc-50 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root">
      <div class="app-boot-loader" role="status" aria-live="polite" aria-label="Loading">
        <svg class="app-boot-spinner" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle class="app-boot-track" cx="12" cy="12" r="10" stroke-width="2.75"></circle>
          <path stroke="currentColor" d="M12 2a10 10 0 0 1 10 10" stroke-width="2.75" stroke-linecap="round"></path>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
