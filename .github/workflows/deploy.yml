name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pull, Build & Serve Frontend via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            export PATH="$PATH:/usr/local/bin:/usr/bin:$HOME/.npm-global/bin"
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"

            cd /var/www/puc_centre_frontend
            git pull origin main

            if [ ! -f .env ]; then
              echo "VITE_API_URL=https://iaj4y-5001.aiccloud.online" > .env
            fi

            npm install --no-audit --no-fund
            npm run build

            pm2 delete puc-frontend > /dev/null 2>&1 || true
            pm2 serve /var/www/puc_centre_frontend/dist 3001 --name puc-frontend --spa

            pm2 save
            pm2 status
